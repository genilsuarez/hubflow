<html lang="es">
<head>
<meta charset="UTF-8">

<title>HubFlow — Inventario de módulos</title>
<style>
  :root {
    --bg: #F5F6F9;
    --bg-raised: #FFFFFF;
    --ink: #1A1D24;
    --ink-soft: #565D6B;
    --ink-faint: #8A91A0;
    --border: #DEE2EA;
    --border-soft: #EAEDF3;
    --accent: #2563EB;
    --accent-soft: #E7EEFE;
    --row-hover: #EEF1F8;
    --cat-vocab: #7B5EA7;
    --cat-vocab-soft: #F1ECF9;
    --cat-grammar: #B8860B;
    --cat-grammar-soft: #FBF3E2;
    --cat-pron: #3D6B9F;
    --cat-pron-soft: #E9F0F9;
    --cat-analysis: #3D7F7F;
    --cat-analysis-soft: #E8F4F4;
    --shadow: 0 1px 2px rgba(20, 24, 32, 0.04), 0 4px 16px rgba(20, 24, 32, 0.05);
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171C;
      --bg-raised: #1B1F26;
      --ink: #EBEDF2;
      --ink-soft: #A6ACB9;
      --ink-faint: #6E7481;
      --border: #2A2F38;
      --border-soft: #21252D;
      --accent: #5B8DF6;
      --accent-soft: #1B2740;
      --row-hover: #21262F;
      --cat-vocab: #A98ED4;
      --cat-vocab-soft: #2A2438;
      --cat-grammar: #E6A832;
      --cat-grammar-soft: #332A19;
      --cat-pron: #6FA8DC;
      --cat-pron-soft: #1B2836;
      --cat-analysis: #6BC4C4;
      --cat-analysis-soft: #17302E;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171C;
    --bg-raised: #1B1F26;
    --ink: #EBEDF2;
    --ink-soft: #A6ACB9;
    --ink-faint: #6E7481;
    --border: #2A2F38;
    --border-soft: #21252D;
    --accent: #5B8DF6;
    --accent-soft: #1B2740;
    --row-hover: #21262F;
    --cat-vocab: #A98ED4;
    --cat-vocab-soft: #2A2438;
    --cat-grammar: #E6A832;
    --cat-grammar-soft: #332A19;
    --cat-pron: #6FA8DC;
    --cat-pron-soft: #1B2836;
    --cat-analysis: #6BC4C4;
    --cat-analysis-soft: #17302E;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.35);
  }
  :root[data-theme="light"] {
    --bg: #F5F6F9;
    --bg-raised: #FFFFFF;
    --ink: #1A1D24;
    --ink-soft: #565D6B;
    --ink-faint: #8A91A0;
    --border: #DEE2EA;
    --border-soft: #EAEDF3;
    --accent: #2563EB;
    --accent-soft: #E7EEFE;
    --row-hover: #EEF1F8;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    padding: clamp(20px, 4vw, 44px);
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 1180px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1.5rem, 3vw, 2rem);
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0 0 4px;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .subtitle {
    color: var(--ink-soft);
    font-size: 0.86rem;
    max-width: 60ch;
  }
  .meta-line {
    text-align: right;
    color: var(--ink-faint);
    font-size: 0.72rem;
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
  }

  /* Summary strip */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr) auto;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-left: 3px solid var(--cat-color, var(--accent));
    border-radius: 8px;
    padding: 10px 14px;
    box-shadow: var(--shadow);
  }
  .stat-card .stat-label {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-faint);
    margin-bottom: 3px;
  }
  .stat-card .stat-value {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.15rem;
    font-weight: 600;
  }
  .stat-card .stat-value small {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 0.68rem;
    color: var(--ink-soft);
    margin-left: 3px;
  }
  .stat-card.total {
    background: var(--accent);
    border-left-color: var(--accent);
    border-color: var(--accent);
  }
  .stat-card.total .stat-label { color: rgba(255,255,255,0.75); }
  .stat-card.total .stat-value { color: #fff; }
  .stat-card.total .stat-value small { color: rgba(255,255,255,0.75); }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .search-box {
    position: relative;
    flex: 1 1 220px;
    min-width: 180px;
  }
  .search-box input {
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 12px 8px 30px;
    font-family: var(--font-body);
    font-size: 0.82rem;
    color: var(--ink);
  }
  .search-box input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .search-box::before {
    content: "";
    position: absolute;
    left: 10px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px;
    border: 1.5px solid var(--ink-faint);
    border-radius: 50%;
  }
  .search-box::after {
    content: "";
    position: absolute;
    left: 19px; top: 63%;
    width: 5px; height: 1.5px;
    background: var(--ink-faint);
    transform: rotate(45deg);
  }
  .chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: var(--font-body);
    font-size: 0.74rem;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-raised);
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.12s, color 0.12s, background 0.12s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--chip-color, var(--accent)); }
  .chip.active {
    background: var(--chip-soft, var(--accent-soft));
    border-color: var(--chip-color, var(--accent));
    color: var(--chip-color, var(--accent));
  }
  .chip[data-cat="vocab"] { --chip-color: var(--cat-vocab); --chip-soft: var(--cat-vocab-soft); }
  .chip[data-cat="grammar"] { --chip-color: var(--cat-grammar); --chip-soft: var(--cat-grammar-soft); }
  .chip[data-cat="pronunciation"] { --chip-color: var(--cat-pron); --chip-soft: var(--cat-pron-soft); }
  .chip[data-cat="analysis"] { --chip-color: var(--cat-analysis); --chip-soft: var(--cat-analysis-soft); }

  .result-count {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--ink-faint);
    margin: 0 0 8px;
  }

  /* Table */
  .table-wrap {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: auto;
    max-height: 68vh;
    box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg-raised);
    text-align: left;
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    font-weight: 600;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--ink); }
  thead th .arrow { display: inline-block; width: 10px; opacity: 0.5; font-size: 0.6rem; }
  thead th.sorted { color: var(--accent); }
  thead th.sorted .arrow { opacity: 1; }
  thead th.num, td.num { text-align: right; }

  tbody tr { border-bottom: 1px solid var(--border-soft); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--row-hover); }
  td { padding: 8px 14px; vertical-align: middle; }
  td.title-cell { display: flex; align-items: center; gap: 8px; min-width: 220px; }
  td.title-cell .icon { font-size: 0.95rem; flex-shrink: 0; }
  td.title-cell .title { font-weight: 500; }
  td.title-cell .id { display: block; font-family: var(--font-mono); font-size: 0.66rem; color: var(--ink-faint); margin-top: 1px; }
  td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  td.subcat { color: var(--ink-faint); font-size: 0.78rem; }

  .pill {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .pill.cat-vocab { color: var(--cat-vocab); background: var(--cat-vocab-soft); }
  .pill.cat-grammar { color: var(--cat-grammar); background: var(--cat-grammar-soft); }
  .pill.cat-pronunciation { color: var(--cat-pron); background: var(--cat-pron-soft); }
  .pill.cat-analysis { color: var(--cat-analysis); background: var(--cat-analysis-soft); }

  .cefr-pill {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    border: 1px solid var(--border);
    color: var(--ink-soft);
  }

  footer {
    margin-top: 14px;
    color: var(--ink-faint);
    font-size: 0.72rem;
    text-align: center;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 720px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .stat-card.total { grid-column: 1 / -1; }
    td.subcat, th[data-key="subcategory"] { display: none; }
  }
</style>
</head>

  </div>

  <footer id="footer"></footer>
</div>

ubcategory":"precision","cefr":"b2","items":40,"modes":5,"icon":"🎯"},{"id":"c1-professional-world","title":"Professional & Business World (C1)","category":"vocab","subcategory":"thematic","cefr":"c1","items":40,"modes":5,"icon":"💼"},{"id":"c1-science-technology","title":"Science & Technology (C1)","category":"vocab","subcategory":"thematic","cefr":"c1","items":40,"modes":5,"icon":"🔬"},{"id":"c1-law-politics-society","title":"Law, Politics & Society (C1)","category":"vocab","subcategory":"thematic","cefr":"c1","items":40,"modes":5,"icon":"⚖️"},{"id":"c1-etymology-roots","title":"Etymology & Word Roots (C1)","category":"vocab","subcategory":"precision","cefr":"c1","items":40,"modes":5,"icon":"🔍"}];

const CAT_LABEL = { vocab: 'Vocabulary', grammar: 'Grammar', pronunciation: 'Pronunciation', analysis: 'Analysis' };
const SUBCAT_LABEL = {
  foundations: 'Foundations', thematic: 'Thematic', expression: 'Expression', precision: 'Precision',
  morphology: 'Morphology', tense: 'Tense', structure: 'Structure', nuance: 'Nuance'
};

let state = { sortKey: 'category', sortDir: 1, cat: 'all', cefr: 'all', q: '' };

function computeSummary() {
  const byCat = {};
  DATA.forEach(m => {
    byCat[m.category] = byCat[m.category] || { count: 0, items: 0 };
    byCat[m.category].count++;
    byCat[m.category].items += m.items;
  });
  return byCat;
}

function renderSummary() {
  const byCat = computeSummary();
  const totalItems = DATA.reduce((s, m) => s + m.items, 0);
  const el = document.getElementById('summary');
  const order = ['vocab', 'grammar', 'pronunciation', 'analysis'];
  el.innerHTML = order.map(cat => {
    const v = byCat[cat] || { count: 0, items: 0 };
    return `<div class="stat-card" style="--cat-color: var(--cat-${cat === 'pronunciation' ? 'pron' : cat})">
      <div class="stat-label">${CAT_LABEL[cat]}</div>
      <div class="stat-value">${v.count}<small>módulos · ${v.items} items</small></div>
    </div>`;
  }).join('') + `<div class="stat-card total">
      <div class="stat-label">Total catálogo</div>
      <div class="stat-value">${DATA.length}<small>módulos · ${totalItems} items</small></div>
    </div>`;
}

function getFiltered() {
  return DATA.filter(m => {
    if (state.cat !== 'all' && m.category !== state.cat) return false;
    if (state.cefr !== 'all' && m.cefr !== state.cefr) return false;
    if (state.q) {
      const q = state.q.toLowerCase();
      if (!m.title.toLowerCase().includes(q) && !m.id.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function sortRows(rows) {
  const { sortKey, sortDir } = state;
  return [...rows].sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if (av < bv) return -1 * sortDir;
    if (av > bv) return 1 * sortDir;
    return a.title.localeCompare(b.title);
  });
}

function render() {
  const rows = sortRows(getFiltered());
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.map(m => `
    <tr>
      <td class="title-cell">
        <span class="icon">${m.icon}</span>
        <span>
          <span class="title">${m.title}</span>
          <span class="id">${m.id}</span>
        </span>
      </td>
      <td><span class="pill cat-${m.category}">${CAT_LABEL[m.category]}</span></td>
      <td class="subcat">${m.subcategory ? (SUBCAT_LABEL[m.subcategory] || m.subcategory) : '—'}</td>
      <td><span class="cefr-pill">${m.cefr.toUpperCase()}</span></td>
      <td class="num">${m.items}</td>
      <td class="num">${m.modes}</td>
    </tr>
  `).join('');

  document.getElementById('resultCount').textContent =
    `${rows.length} de ${DATA.length} módulos · ${rows.reduce((s, m) => s + m.items, 0)} items`;

  document.querySelectorAll('thead th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === state.sortKey);
    const arrow = th.querySelector('.arrow');
    if (th.dataset.key === state.sortKey) arrow.textContent = state.sortDir === 1 ? '↑' : '↓';
    else arrow.textContent = '↕';
  });

  document.getElementById('footer').textContent =
    `HubFlow · 120 módulos · 4 categorías · CEFR A1–C1 (C2 excluido por diseño editorial)`;
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (state.sortKey === key) state.sortDir *= -1;
    else { state.sortKey = key; state.sortDir = 1; }
    render();
  });
});

document.getElementById('catFilters').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('#catFilters .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  state.cat = btn.dataset.cat;
  render();
});

document.getElementById('cefrFilters').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('#cefrFilters .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  state.cefr = btn.dataset.cefr;
  render();
});

document.getElementById('search').addEventListener('input', e => {
  state.q = e.target.value;
  render();
});

renderSummary();
render();
</script>
