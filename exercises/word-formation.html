<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Formation — HubFlow</title>
<meta name="description" content="Word Formation — Grammar &amp; Spelling nivel B1. Nouns, Adjectives, Negatives, Mixed — build the correct derived form. Practica gratis en HubFlow.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23B8860B'/%3E%3Cpath d='M9 8h14v16H9z' stroke='white' stroke-width='2' fill='none'/%3E%3Cpath d='M12 12h8M12 16h6' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E" type="image/svg+xml">
<script src="../js/lp-theme.js"></script>
<script src="../js/lp-input-zoom.js"></script>
<script src="../js/lp-nav-icons.js"></script>
<script src="../js/lp-platform-urls.js"></script>
<script src="../js/lp-guest-reset.js"></script>
<script src="../js/lp-login.js"></script>
<script src="../js/lp-nav-helpers.js"></script>
<script src="../js/lp-about-content.js"></script>
<script src="../js/lp-about.js"></script>
<style>body{background:#FFFFFF;color:#2C2418}[data-theme="dark"] body{background:#181B20;color:#E8EAED}</style>
<link rel="stylesheet" href="../css/base.min.css">
<link rel="stylesheet" href="../css/components.min.css">
<link rel="stylesheet" href="../css/buttons.min.css">
<link rel="stylesheet" href="../css/exercise-enhanced.min.css">
<link rel="stylesheet" href="../css/sidebar.min.css">
<link rel="stylesheet" href="../css/lp-nav-active.min.css">
<link rel="stylesheet" href="../css/lp-about.min.css">
<link rel="stylesheet" href="../css/standalone-shell.min.css">
<style>
  .progress__fill { background: var(--lp-cat-amber); }
  [data-area] { gap: 12px; }
  .sentence-card { width: 100%; max-width: 720px; background: var(--lp-surface); border: 1.5px solid var(--lp-border); border-radius: var(--lp-radius-lg); padding: 22px 20px; text-align: center; box-shadow: var(--lp-shadow-sm); }
  .sentence-card .sc-icon { font-size: 1.6rem; margin-bottom: 6px; }
  .sentence-card .sc-text { font-family: var(--lp-font-display); font-size: 1.1rem; font-weight: 500; color: var(--lp-ink); line-height: 1.5; }
  .sentence-card .sc-text .blank { display: inline-block; min-width: 70px; border-bottom: 2.5px dashed var(--lp-cat-amber); color: var(--lp-cat-amber); font-weight: 700; padding: 0 4px; }
  .sentence-card .sc-counter { font-size: .62rem; font-weight: 700; color: var(--lp-muted); margin-top: 8px; }
  .root-word { font-size: .85rem; font-weight: 700; color: var(--lp-cat-amber); background: rgba(184,134,11,.08); padding: 6px 14px; border-radius: var(--lp-radius-sm); border: 1.5px solid rgba(184,134,11,.3); }
  .answer-input { width: 100%; max-width: 280px; padding: 12px 14px; font-size: 1rem; text-align: center; border-radius: .5rem; border: 2px solid var(--lp-border); background: var(--lp-surface); color: var(--lp-ink); outline: none; transition: border-color .2s; font-family: var(--lp-font-body); }
  .answer-input:focus { border-color: var(--lp-cat-amber); }
  .answer-input.correct { border-color: var(--lp-success); }
  .answer-input.wrong { border-color: var(--lp-error); }
  .fc-card { max-width: 720px; height: 220px; }
  .wf-front .fc-term { font-size: 1.1rem; color: var(--lp-cat-amber); line-height: 1.4; }
  .wf-front .fc-detail { font-size: .82rem; color: var(--lp-ink-soft); margin-top: 4px; }
  .fc-back { background: color-mix(in srgb, var(--lp-cat-amber) 10%, var(--lp-surface)); border-color: var(--lp-cat-amber); }
  @media (max-width: 480px) { .answer-input { max-width: 240px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar"><a href="../index.html" class="lp-icon-btn" aria-label="Volver a HubFlow" title="Volver a HubFlow">←</a>
</div>
  <div class="header">
    <h1>🧩 Word Formation</h1>
    <div class="cat-bar" id="catBar"></div>
    <div class="pill-bar"><button class="pill-btn active" data-mode="study">📖 Study</button><button class="pill-btn" data-mode="quiz">🎯 Quiz</button><button class="pill-btn" data-mode="timed">⏱️ Timed</button></div>
    <div class="timer-bar" id="timerBar"><span class="timer-display" id="timerDisplay">1:00</span></div>
    <div class="progress"><div class="progress__labels"><span id="progTxt">0 / 12</span><span id="progPct">0%</span></div><div class="progress__track"><div class="progress__fill" id="progFill"></div></div></div>
  </div>
  <div class="scroll-body">
    <div data-area="quiz"><div class="sentence-card"><div class="sc-icon" id="scIcon"></div><div class="sc-text" id="scText"></div><div class="sc-counter" id="scCounter"></div></div><div class="root-word" id="rootWord"></div><input class="answer-input" id="answerInput" type="text" placeholder="Type the correct form…" autocomplete="off" autocorrect="off" spellcheck="false"><button class="lp-btn lp-btn--primary" id="checkBtn">Check ✓</button><div class="explain-box" id="explainBox"></div></div>
    <div data-area="study"><div class="fc-count" id="fcCounter">1 / 12</div><div class="fc-card" id="fcCard"><div class="fc-inner"><div class="fc-face wf-front"><div class="fc-emoji" id="fcEmoji">🧩</div><div class="fc-term" id="fcSentence"></div><div class="fc-detail" id="fcRoot"></div><div class="fc-hint">tap to see answer</div></div><div class="fc-face fc-back"><div class="fc-term" id="fcAnswer" style="font-size:1.4rem;color:var(--lp-success)"></div><div class="fc-detail" id="fcExplain"></div></div></div></div><div class="fc-nav"><button class="lp-btn lp-btn--ghost" id="shuffleBtn">🔀</button><button class="lp-btn lp-btn--ghost" id="prevBtn">←</button><button class="lp-btn lp-btn--primary" id="nextBtn">→</button><button class="lp-btn lp-btn--ghost" id="quizSkipBtn">⏭ Saltar</button><button class="lp-btn lp-btn--purple" id="quizNextBtn" hidden>Siguiente →</button></div></div>
  </div>
  <div class="result-overlay" id="resultOverlay"></div>
</div>
<script type="module">
import { CATEGORIES } from '../data/word-formation.js';
import { initWordFormation } from '../js/engines/word-formation-engine.js';

initWordFormation({
  categories: CATEGORIES,
  scoreKeyPrefix: 'wf',
});
</script>

<script type="module" src="../js/exercise-shell.js"></script>
</body>
</html>
