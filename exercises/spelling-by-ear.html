<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling by Ear — HubFlow</title>
<meta name="description" content="Spelling by Ear — Pronunciation nivel A2. Hear the verb (TTS) → write the -ing or -ed form. Practica gratis en HubFlow.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23B8860B'/%3E%3Cpath d='M9 8h14v16H9z' stroke='white' stroke-width='2' fill='none'/%3E%3Cpath d='M12 12h8M12 16h6' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E" type="image/svg+xml">
<script src="../js/lp-theme.min.js"></script>
<script src="../js/lp-input-zoom.min.js" defer></script>
<script src="../js/lp-nav-icons.min.js" defer></script>
<script src="../js/lp-platform-urls.min.js" defer></script>
<script src="../js/lp-guest-reset.min.js" defer></script>
<script src="../js/lp-login.min.js" defer></script>
<script src="../js/lp-nav-helpers.min.js" defer></script>
<script src="../js/lp-about-content.min.js" defer></script>
<script src="../js/lp-about.min.js" defer></script>
<style>body{background:#FCFBF9;color:#2C2418}[data-theme="dark"] body{background:#181B20;color:#E8EAED}</style>
<link rel="stylesheet" href="../css/base.min.css">
<link rel="stylesheet" href="../css/components.min.css">
<link rel="stylesheet" href="../css/buttons.min.css">
<link rel="stylesheet" href="../css/exercise-enhanced.min.css">
<link rel="stylesheet" href="../css/sidebar.min.css">
<link rel="stylesheet" href="../css/lp-nav-active.min.css">
<link rel="stylesheet" href="../css/lp-about.min.css">
<link rel="stylesheet" href="../css/standalone-shell.min.css">
<style>
  .progress__fill { background: var(--lp-cat-blue); }
  [data-area] { gap: 14px; }
  .listen-btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--lp-cat-blue); background: rgba(59,130,246,.08); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; transition: all .2s; }
  .listen-btn:hover { background: rgba(59,130,246,.15); transform: scale(1.06); }
  .listen-btn:active { transform: scale(.95); }
  .listen-btn:focus-visible { outline: 2px solid var(--lp-accent); outline-offset: 2px; }
  .quiz-actions { display: flex; justify-content: center; gap: 8px; }
  .form-label { font-size: .75rem; font-weight: 800; color: var(--lp-cat-blue); background: rgba(59,130,246,.08); padding: 5px 12px; border-radius: var(--lp-radius-sm); border: 1.5px solid rgba(59,130,246,.3); text-transform: uppercase; letter-spacing: .05em; }
  .sc-counter { font-size: .62rem; font-weight: 700; color: var(--lp-muted); }
  .answer-input { width: 100%; max-width: 260px; padding: 14px 16px; font-size: 1.1rem; text-align: center; border-radius: .5rem; border: 2px solid var(--lp-border); background: var(--lp-surface); color: var(--lp-ink); outline: none; transition: border-color .2s; font-family: var(--lp-font-body); font-weight: 600; }
  .answer-input:focus { border-color: var(--lp-cat-blue); }
  .answer-input.correct { border-color: var(--lp-success); }
  .answer-input.wrong { border-color: var(--lp-error); }
  .no-tts { max-width: 720px; font-size: .8rem; color: var(--lp-error-dark); background: var(--lp-error-soft); border: 1px solid var(--lp-error); border-radius: var(--lp-radius-sm); padding: 12px 16px; text-align: center; display: none; }
  .no-tts.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar"><a href="../index.html" class="lp-icon-btn" aria-label="Volver a HubFlow" title="Volver a HubFlow">←</a>
</div>
  <div class="header">
    <h1>👂 Spelling by Ear</h1>
    <div class="cat-bar" id="catBar"></div>
    <div class="pill-bar"><button class="pill-btn active" data-mode="quiz">🎯 Quiz</button><button class="pill-btn" data-mode="timed">⏱️ Timed</button></div>
    <div class="timer-bar" id="timerBar"><span class="timer-display" id="timerDisplay">1:00</span></div>
    <div class="progress"><div class="progress__labels"><span id="progTxt">0 / 15</span><span id="progPct">0%</span></div><div class="progress__track"><div class="progress__fill" id="progFill"></div></div></div>
  </div>
  <div class="scroll-body">
    <div class="no-tts" id="noTts">🔇 Tu navegador no soporta síntesis de voz. Prueba en Chrome o Safari.</div>
    <div data-area="quiz">
      <div class="form-label" id="formLabel">Write the -ing form</div>
      <div class="sc-counter" id="scCounter"></div>
      <input class="answer-input" id="answerInput" type="text" placeholder="Type the form…" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="quiz-actions">
        <button class="listen-btn" id="playAudioBtn" aria-label="Listen to base verb">🔊</button>
        <button class="lp-btn lp-btn--primary" id="checkBtn">Check ✓</button>
      </div>
      <div class="explain-box" id="explainBox"></div>
    </div>
  </div>
  <div class="fc-nav">
    <button class="lp-btn lp-btn--ghost" id="quizSkipBtn">⏭ Saltar</button>
    <button class="lp-btn lp-btn--purple" id="quizNextBtn" hidden>Siguiente →</button>
  </div>
  <div class="result-overlay" id="resultOverlay"></div>
</div>
<script type="module">
import { CATEGORIES } from '../data/spelling-by-ear.js';
import { initSpellingByEar } from '../js/engines/spelling-by-ear-engine.js';

initSpellingByEar({
  categories: CATEGORIES,
  scoreKeyPrefix: 'sbe',
});
</script>

<script type="module" src="../js/exercise-shell.js"></script>
</body>
</html>
