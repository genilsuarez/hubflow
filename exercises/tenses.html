<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenses — HubFlow</title>
<meta name="description" content="Verb Tenses — Grammar &amp; Spelling nivel A1. Present, Past, Future, Perfect, Perfect Simple vs Continuous, Have/Has/Had. Practica gratis en HubFlow.">

<script src="../js/lp-theme.js"></script>
<script src="../js/lp-input-zoom.js"></script>
<script src="../js/lp-nav-icons.js"></script>
<script src="../js/lp-platform-urls.js"></script>
<script src="../js/lp-guest-reset.js"></script>
<script src="../js/lp-login.js"></script>
<script src="../js/lp-nav-helpers.js"></script>
<script src="../js/lp-about-content.js"></script>
<script src="../js/lp-about.js"></script>
<style>body{background:#FFFFFF;color:#2C2418}[data-theme="dark"] body{background:#181B20;color:#E8EAED}</style>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/buttons.css">
<link rel="stylesheet" href="../css/exercise-enhanced.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/lp-nav-active.css">
<link rel="stylesheet" href="../css/lp-about.css">
<link rel="stylesheet" href="../css/standalone-shell.css">
<style>
  .progress__fill { background: var(--lp-cat-green); }
  [data-area] { gap: 12px; }
  .sentence-card { width: 100%; max-width: 720px; background: var(--lp-surface); border: 1.5px solid var(--lp-border); border-radius: var(--lp-radius-lg); padding: 22px 20px; text-align: center; box-shadow: var(--lp-shadow-sm); }
  .sentence-card .sc-icon { font-size: 1.6rem; margin-bottom: 6px; }
  .sentence-card .sc-text { font-family: var(--lp-font-display); font-size: 1.15rem; font-weight: 500; color: var(--lp-ink); line-height: 1.5; }
  .sentence-card .sc-text .blank { display: inline-block; min-width: 50px; border-bottom: 2.5px dashed var(--lp-cat-green); color: var(--lp-cat-green); font-weight: 700; padding: 0 4px; }
  .sentence-card .sc-counter { font-size: .62rem; font-weight: 700; color: var(--lp-muted); margin-top: 8px; }
  .fc-card { max-width: 720px; height: 200px; }
  .t-front .fc-term { font-size: 1.3rem; color: var(--lp-cat-green); line-height: 1.4; }
  .fc-back { background: color-mix(in srgb, var(--lp-cat-green) 10%, var(--lp-surface)); border-color: var(--lp-cat-green); }
  @media (max-width: 480px) { .word-opt { min-width: 50px; padding: 10px 14px; font-size: .8rem; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar"><a href="../index.html" class="lp-icon-btn" aria-label="Volver a HubFlow" title="Volver a HubFlow">←</a>
</div>
  <div class="header">
    <h1>⏱️ Verb Tenses</h1>
    <div class="cat-bar" id="catBar"></div>
    <div class="pill-bar"><button class="pill-btn active" data-mode="study">📖 Study</button><button class="pill-btn" data-mode="practice">🎯 Quiz</button><button class="pill-btn" data-mode="timed">⏱️ Timed</button></div>
    <div class="timer-bar" id="timerBar"><span class="timer-display" id="timerDisplay">1:00</span></div>
    <div class="progress"><div class="progress__labels"><span id="progTxt">0 / 12</span><span id="progPct">0%</span></div><div class="progress__track"><div class="progress__fill" id="progFill"></div></div></div>
  </div>
  <div class="scroll-body">
    <div data-area="practice"><div class="sentence-card"><div class="sc-icon" id="scIcon"></div><div class="sc-text" id="scText"></div><div class="sc-counter" id="scCounter"></div></div><div class="word-options" id="wordOptions"></div><div class="explain-box" id="explainBox"></div></div>
    <div data-area="study"><div class="fc-count" id="fcCounter">1 / 12</div><div class="fc-card" id="fcCard"><div class="fc-inner"><div class="fc-face t-front"><div class="fc-emoji" id="fcEmoji">⏱️</div><div class="fc-term" id="fcSentence"></div><div class="fc-hint">tap to see answer</div></div><div class="fc-face fc-back"><div class="fc-term" id="fcAnswer" style="font-size:1.4rem;color:var(--lp-success)"></div><div class="fc-detail" id="fcExplain"></div></div></div></div><div class="fc-nav"><button class="lp-btn lp-btn--ghost" id="shuffleBtn">🔀</button><button class="lp-btn lp-btn--ghost" id="prevBtn">←</button><button class="lp-btn lp-btn--primary" id="nextBtn">→</button><button class="lp-btn lp-btn--ghost" id="quizSkipBtn">⏭ Saltar</button><button class="lp-btn lp-btn--purple" id="quizNextBtn" hidden>Siguiente →</button></div></div>
  </div>
  <div class="result-overlay" id="resultOverlay"></div>
</div>
<script type="module">
import { CATEGORIES } from '../data/tenses.js';
import { shuffle } from '../js/array-utils.js';
import { recordScore, recordStudyItemSeen } from '../js/progress-store.js';
import { Timer, formatTime, renderCatBar as sharedRenderCatBar, updateProgress, wireModeTabs } from '../js/exercise-ui.js';
import { finishExercise, advanceStudyCard } from '../js/exercise-flow.js';
import { initSwipe } from '../js/swipe.js';
let currentCat = Object.keys(CATEGORIES)[0], mode = 'study', deck = [], idx = 0, score = 0, total = 0, timer = null;
sharedRenderCatBar({
  containerId: 'catBar', categories: CATEGORIES,
  getCurrentCat: () => currentCat, setCurrentCat: v => currentCat = v,
  onChange: startMode,
});
wireModeTabs({ getMode: () => mode, setMode: v => mode = v, onChange: startMode });
document.getElementById('quizSkipBtn')?.addEventListener('click', () => skipPractice());
function setQuizAnswered(answered) { const nextBtn = document.getElementById('quizNextBtn'); const skipBtn = document.getElementById('quizSkipBtn'); if (nextBtn) nextBtn.hidden = !answered; if (skipBtn) skipBtn.hidden = answered; }
function skipPractice() { if (idx >= total) return; idx++; updProgress(idx, total); renderPractice(); }
function startMode() { stopTimer(); document.querySelectorAll('[data-area]').forEach(a => a.classList.remove('show')); document.getElementById('timerBar').classList.remove('show'); setQuizAnswered(false); if (mode === 'practice') initPractice(false); else if (mode === 'timed') initPractice(true); else initStudy(); }
function stopTimer() { if (timer) { timer.stop(); timer = null; } }
function getData() { return CATEGORIES[currentCat].items; }
const updProgress = (c, t) => updateProgress(c, t, document.getElementById('progFill'), document.getElementById('progTxt'), document.getElementById('progPct'));
function initPractice(timed) { deck = shuffle(getData()); idx = 0; score = 0; total = Math.min(timed ? 10 : deck.length, deck.length); document.querySelector('[data-area="practice"]').classList.add('show'); if (timed) { document.getElementById('timerBar').classList.add('show'); timer = new Timer(total*7, r => { const el = document.getElementById('timerDisplay'); el.textContent = formatTime(r); el.classList.toggle('warn', r<=10); }, () => finishPractice()); timer.start(); } renderPractice(); }
function renderPractice() { if (idx >= total) { stopTimer(); finishPractice(); return; } const item = deck[idx]; document.getElementById('scIcon').textContent = CATEGORIES[currentCat].icon; document.getElementById('scText').innerHTML = item.sentence.replace('___', '<span class="blank">?</span>'); document.getElementById('scCounter').textContent = `${idx+1} / ${total}`; document.getElementById('explainBox').textContent = ''; setQuizAnswered(false); const opts = shuffle([...(item.options || CATEGORIES[currentCat].options)]); const optsEl = document.getElementById('wordOptions'); optsEl.innerHTML = opts.map(o => `<button class="word-opt" data-val="${o}">${o}</button>`).join(''); optsEl.querySelectorAll('.word-opt').forEach(btn => btn.addEventListener('click', () => { optsEl.querySelectorAll('.word-opt').forEach(b => { b.classList.add('disabled'); b.style.pointerEvents = 'none'; }); if (btn.dataset.val === item.correct) { btn.classList.add('correct'); score++; } else { btn.classList.add('wrong'); optsEl.querySelectorAll('.word-opt').forEach(b => { if (b.dataset.val === item.correct) b.classList.add('correct'); }); } document.getElementById('scText').innerHTML = item.sentence.replace('___', `<span class="blank">${item.correct}</span>`); document.getElementById('explainBox').textContent = item.explain; idx++; updProgress(idx, total); const nextBtn = document.getElementById('quizNextBtn'); if (nextBtn) { nextBtn.textContent = idx >= total ? 'Ver resultado →' : 'Siguiente →'; setQuizAnswered(true); nextBtn.onclick = () => renderPractice(); nextBtn.focus({ preventScroll: true }); } else { setTimeout(renderPractice, 1400); } })); updProgress(idx, total); }
function finishPractice() { const pct = finishExercise({ correct: score, total, startMode, setMode: v => mode = v }); recordScore(`tense-${currentCat}`, pct); }
function initStudy() { deck = shuffle(getData()); idx = 0; document.querySelector('[data-area="study"]').classList.add('show'); renderStudyCard(); }
function renderStudyCard() { const item = deck[idx]; recordStudyItemSeen({ storagePrefix: 'tense', category: currentCat, term: item.sentence, totalItems: getData().length }); document.getElementById('fcCard').classList.remove('flip'); document.getElementById('fcEmoji').textContent = CATEGORIES[currentCat].icon; document.getElementById('fcSentence').textContent = item.sentence.replace('___', '_____'); document.getElementById('fcAnswer').textContent = item.correct; document.getElementById('fcExplain').textContent = item.explain; document.getElementById('fcCounter').textContent = `${idx+1} / ${deck.length}`; updProgress(idx+1, deck.length); }
document.getElementById('fcCard').addEventListener('click', () => document.getElementById('fcCard').classList.toggle('flip'));
document.getElementById('nextBtn').addEventListener('click', () => advanceCard(1));
document.getElementById('prevBtn').addEventListener('click', () => advanceCard(-1));
document.getElementById('shuffleBtn').addEventListener('click', () => { deck = shuffle(deck); idx = 0; renderStudyCard(); });
initSwipe(document.querySelector('[data-area="study"]'), { onNext: () => advanceCard(1), onPrev: () => advanceCard(-1) });

function advanceCard(dir) {
  advanceStudyCard(dir, { getIdx: () => idx, setIdx: v => idx = v, deckLength: deck.length, renderCard: renderStudyCard });
}

// Keyboard: Enter/Space = flip or advance, Arrows = navigate
document.addEventListener('keydown', e => {
  if (mode !== 'study') return;
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') {
      document.activeElement.blur();
    }
    const card = document.getElementById('fcCard');
    if (card.classList.contains('flip')) advanceCard(1);
    else card.classList.add('flip');
  } else if (e.key === 'ArrowRight') { e.preventDefault(); advanceCard(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); advanceCard(-1); }
});

startMode();
</script>

<script type="module" src="../js/exercise-shell.js"></script>
</body>
</html>
