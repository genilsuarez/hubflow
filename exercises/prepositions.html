<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prepositions — HubFlow</title>
<meta name="description" content="Prepositions — Grammar &amp; Spelling nivel A2. Time, Place, Movement, Dependent, Duration (for/since/during/by/until). Practica gratis en HubFlow.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23B8860B'/%3E%3Cpath d='M9 8h14v16H9z' stroke='white' stroke-width='2' fill='none'/%3E%3Cpath d='M12 12h8M12 16h6' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E" type="image/svg+xml">
<script src="../js/lp-theme.js"></script>
<script src="../js/lp-input-zoom.js"></script>
<script src="../js/lp-nav-icons.js"></script>
<script src="../js/lp-platform-urls.js"></script>
<script src="../js/lp-guest-reset.js"></script>
<script src="../js/lp-login.js"></script>
<script src="../js/lp-nav-helpers.js"></script>
<script src="../js/lp-about-content.js"></script>
<script src="../js/lp-about.js"></script>
<style>body{background:#FFFFFF;color:#2C2418}[data-theme="dark"] body{background:#181B20;color:#E8EAED}</style>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/buttons.css">
<link rel="stylesheet" href="../css/exercise-enhanced.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/lp-nav-active.css">
<link rel="stylesheet" href="../css/lp-about.css">
<link rel="stylesheet" href="../css/standalone-shell.css">
<style>
  .progress__fill { background: var(--lp-cat-green); }

  /* Category pills */
  [data-area] { gap: 12px; }

  /* Sentence card */
  .sentence-card {
    width: 100%; max-width: 720px; background: var(--lp-surface); border: 1.5px solid var(--lp-border);
    border-radius: var(--lp-radius-lg); padding: 22px 20px; text-align: center;
    box-shadow: var(--lp-shadow-sm);
  }
  .sentence-card .sc-icon { font-size: 1.6rem; margin-bottom: 6px; }
  .sentence-card .sc-text {
    font-family: var(--lp-font-display); font-size: 1.15rem; font-weight: 500;
    color: var(--lp-ink); line-height: 1.5;
  }
  .sentence-card .sc-text .blank {
    display: inline-block; min-width: 60px; border-bottom: 2.5px dashed var(--lp-cat-green);
    color: var(--lp-cat-green); font-weight: 700; padding: 0 4px;
  }
  .sentence-card .sc-counter {
    font-size: .62rem; font-weight: 700; color: var(--lp-muted); margin-top: 8px;
  }

  /* Options */
  .word-options { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 720px; }
  .word-opt {
    font-family: var(--lp-font-body); font-weight: 700; font-size: .88rem;
    padding: 12px 20px; border-radius: var(--lp-radius-sm); border: 1.5px solid var(--lp-border);
    background: var(--lp-surface); color: var(--lp-ink); cursor: pointer;
    transition: all .2s var(--lp-ease); min-width: 70px; text-align: center;
  }
  .word-opt:hover:not(.disabled) { border-color: var(--lp-cat-green); background: rgba(39,134,90,.08); transform: translateY(-2px); }
  .word-opt.correct { border-color: var(--lp-success); background: var(--lp-success-soft); color: var(--lp-success-dark); }
  .word-opt.wrong { border-color: var(--lp-error); background: var(--lp-error-soft); color: var(--lp-error-dark); }
  .word-opt.disabled { cursor: default; opacity: .7; }
  [data-theme="dark"] .word-opt.correct { background: rgba(39, 134, 90, 0.35); border-color: #6FE8A8; color: #6FE8A8; box-shadow: 0 0 0 1px rgba(111, 232, 168, 0.3); }
  [data-theme="dark"] .word-opt.wrong { background: rgba(192, 57, 43, 0.35); border-color: #FF9F9F; color: #FF9F9F; box-shadow: 0 0 0 1px rgba(255, 159, 159, 0.3); }

  /* Study flashcard */
  .fc-card { max-width: 720px; height: 200px; }
  .prep-front .fc-term { font-size: 1.3rem; color: var(--lp-cat-green); line-height: 1.4; }
  .fc-back { background: var(--lp-success-soft); border-color: var(--lp-cat-green); }

  .practice-next-btn { margin-top: 12px; padding: 10px 28px; font-size: .88rem; font-weight: 700; }


  @media (max-width: 480px) {
    .word-opt { min-width: 60px; padding: 10px 14px; font-size: .8rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="../index.html" class="lp-icon-btn" aria-label="Volver a HubFlow" title="Volver a HubFlow">←</a>
  </div>

  <div class="header">
    <h1>📐 Prepositions</h1>

    <!-- Category -->
    <div class="cat-bar" id="catBar"></div>

    <!-- Modes -->
    <div class="pill-bar">
      <button class="pill-btn active" data-mode="study">📖 Study</button>
      <button class="pill-btn" data-mode="practice">🎯 Quiz</button>
      <button class="pill-btn" data-mode="timed">⏱️ Timed</button>
    </div>

    <div class="timer-bar" id="timerBar"><span class="timer-display" id="timerDisplay">1:00</span></div>

    <div class="progress">
      <div class="progress__labels"><span id="progTxt">0 / 18</span><span id="progPct">0%</span></div>
      <div class="progress__track"><div class="progress__fill" id="progFill"></div></div>
    </div>
  </div>

  <div class="scroll-body">
    <!-- PRACTICE / TIMED -->
    <div data-area="practice">
      <div class="sentence-card">
        <div class="sc-icon" id="scIcon"></div>
        <div class="sc-text" id="scText"></div>
        <div class="sc-counter" id="scCounter"></div>
      </div>
      <div class="word-options" id="wordOptions"></div>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <!-- STUDY -->
    <div data-area="study">
      <div class="fc-count" id="fcCounter">1 / 18</div>
      <div class="fc-card" id="fcCard">
        <div class="fc-inner">
          <div class="fc-face prep-front">
            <div class="fc-emoji" id="fcEmoji">📐</div>
            <div class="fc-term" id="fcSentence"></div>
            <div class="fc-hint">tap to see answer</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-term" id="fcAnswer" style="font-size:1.4rem;color:var(--lp-success)"></div>
            <div class="fc-detail" id="fcExplain"></div>
          </div>
        </div>
      </div>
      <div class="fc-nav">
        <button class="lp-btn lp-btn--ghost" id="shuffleBtn">🔀</button>
        <button class="lp-btn lp-btn--ghost" id="prevBtn">←</button>
        <button class="lp-btn lp-btn--primary" id="nextBtn">→</button>
        <button class="lp-btn lp-btn--ghost" id="quizSkipBtn">⏭ Saltar</button>
        <button class="lp-btn lp-btn--purple" id="quizNextBtn" hidden>Siguiente →</button>
      </div>
    </div>
  </div>

  <div class="result-overlay" id="resultOverlay"></div>
</div>

<script type="module">
import { CATEGORIES } from '../data/prepositions.js';
import { initPrepositions } from '../js/engines/prepositions-engine.js';

initPrepositions({
  categories: CATEGORIES,
  scoreKeyPrefix: 'prep',
});
</script>

<script type="module" src="../js/exercise-shell.js"></script>
</body>
</html>
