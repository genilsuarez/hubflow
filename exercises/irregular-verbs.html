<html lang="en">
<head>
<meta charset="UTF-8">

<title>Irregular Verbs — HubFlow</title>
<meta name="description" content="Irregular Verbs — Grammar &amp; Spelling nivel A2. Base → Past → Past Participle, Common, Intermediate &amp; Advanced. Practica gratis en HubFlow.">

<style>body{background:#FCFBF9;color:#2C2418}[data-theme="dark"] body{background:#181B20;color:#E8EAED}</style>
<link rel="stylesheet" href="../css/base.min.css">
<link rel="stylesheet" href="../css/components.min.css">
<link rel="stylesheet" href="../css/buttons.min.css">
<link rel="stylesheet" href="../css/exercise-enhanced.min.css">
<link rel="stylesheet" href="../css/sidebar.min.css">
<link rel="stylesheet" href="../css/lp-nav-active.min.css">
<link rel="stylesheet" href="../css/lp-about.min.css">
<link rel="stylesheet" href="../css/standalone-shell.min.css">
<style>
  .progress__fill { background: var(--lp-cat-amber); }

  /* Category pills */
  [data-area] { gap: 10px; }

  /* Flashcard face customization */
  .fc-card { max-width: 720px; height: 220px; }
  .verb-front .fc-term { font-size: 1.8rem; color: var(--lp-cat-amber); }
  .fc-ipa { font-family: 'JetBrains Mono', monospace; font-size: .78rem; color: var(--muted); letter-spacing: .02em; margin-top: 2px; min-height: 1.1em; }
  .fc-back { background: var(--lp-accent-soft); border-color: var(--lp-cat-amber); }

  /* Cadena Base → Past → P. Part.: la línea vertical + los puntos a la
     izquierda de cada fila (::before) refuerzan visualmente que son 3 pasos
     de la MISMA conjugación, no 3 datos sueltos — el color pasa de neutro
     (base, ya se ve grande en el frente) a ámbar (past/p.part., lo nuevo que
     esta tarjeta enseña). La traducción no es un paso más: va aparte, como
     chip, después de la cadena. */
  .verb-forms { display: flex; flex-direction: column; gap: 2px; position: relative; padding-left: 8px; }
  .verb-forms::before {
    content: ''; position: absolute; left: 8px; top: 11px; bottom: 11px; width: 1.5px;
    background: linear-gradient(to bottom, var(--lp-border-strong), var(--lp-cat-amber));
  }
  .verb-forms .vf-row { display: grid; grid-template-columns: 78px 1fr; align-items: center; gap: 10px; padding: 4px 0 4px 16px; position: relative; }
  /* El punto/chip de Base usaba --lp-border (#E7E3DC, casi blanco): contra el
     fondo claro de .fc-back se veía "apagado"/difuminado en vez de neutro.
     --lp-muted da contraste real sin competir con el ámbar de past/p.part. */
  .verb-forms .vf-row::before {
    content: ''; position: absolute; left: -1px; top: 50%; translate: -50% -50%;
    width: 7px; height: 7px; border-radius: 50%; background: var(--lp-muted);
    box-shadow: 0 0 0 3px var(--lp-surface);
  }
  .verb-forms .vf-row--past::before, .verb-forms .vf-row--pp::before { background: var(--lp-cat-amber); }
  .verb-forms .vf-label {
    font-size: .58rem; font-weight: 800; letter-spacing: .03em; color: var(--lp-ink-soft); text-transform: uppercase;
    text-align: center; padding: 3px 6px; border-radius: var(--lp-radius-full, 999px);
    background: var(--lp-surface); border: 1px solid var(--lp-border-strong);
  }
  .verb-forms .vf-row--past .vf-label, .verb-forms .vf-row--pp .vf-label {
    color: var(--lp-cat-amber); background: color-mix(in srgb, var(--lp-cat-amber) 14%, var(--lp-bg-paper));
    border-color: color-mix(in srgb, var(--lp-cat-amber) 40%, var(--lp-border));
  }
  .verb-forms .vf-val { font-family: var(--lp-font-display); font-size: 1.15rem; font-weight: 700; color: var(--lp-ink); }
  .verb-forms .vf-row--base .vf-val { font-weight: 500; color: var(--lp-muted); }
  .verb-forms .vf-val-group { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .verb-forms .vf-ipa { font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: var(--lp-muted); }

  .vf-translation {
    display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 16px;
    border-radius: var(--lp-radius-full, 999px);
    background: color-mix(in srgb, var(--lp-cat-amber) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--lp-cat-amber) 22%, transparent);
  }
  .vf-translation .vf-flag { font-size: 1rem; line-height: 1; }
  .vf-translation .vf-val { font-family: var(--lp-font-display); font-style: italic; font-size: 1rem; font-weight: 600; color: var(--lp-ink); }

  /* Quiz styles */
  .quiz-card { width: 100%; max-width: 720px; background: var(--lp-surface); border: 1.5px solid var(--lp-border); border-radius: var(--lp-radius-lg); padding: 18px; text-align: center; box-shadow: var(--lp-shadow-sm); }
  .quiz-card .q-base { font-family: var(--lp-font-display); font-size: 1.5rem; font-weight: 600; color: var(--lp-cat-amber); }
  .quiz-card .q-label { font-size: .62rem; color: var(--lp-muted); font-weight: 700; margin-top: 4px; text-transform: uppercase; }
  .quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; max-width: 720px; }

  /* Write mode */
  .write-card { width: 100%; max-width: 720px; background: var(--lp-surface); border: 1.5px solid var(--lp-border); border-radius: var(--lp-radius-lg); padding: 20px; text-align: center; box-shadow: var(--lp-shadow-sm); }
  .write-card .w-base { font-family: var(--lp-font-display); font-size: 1.4rem; font-weight: 600; color: var(--lp-cat-amber); margin-bottom: 4px; }
  .write-card .w-label { font-size: .62rem; color: var(--lp-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
  .write-inputs { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .write-field { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .write-field label { font-size: .6rem; font-weight: 700; color: var(--lp-muted); text-transform: uppercase; }
  .write-field input {
    width: 130px; font-family: var(--lp-font-mono); font-size: .82rem; font-weight: 600;
    text-align: center; padding: 8px 10px; border-radius: var(--lp-radius-sm);
    border: 1.5px solid var(--lp-border); background: var(--lp-bg-paper); color: var(--lp-ink);
    outline: none; transition: border-color .2s;
  }
  .write-field input:focus { border-color: var(--lp-cat-amber); }
  .write-field input.correct { border-color: var(--lp-success); background: var(--lp-success-soft); }
  .write-field input.wrong { border-color: var(--lp-error); background: var(--lp-error-soft); }
  .write-feedback { font-size: .72rem; font-weight: 600; margin-top: 8px; min-height: 1.2em; }
  .write-feedback.ok { color: var(--lp-success); }
  .write-feedback.err { color: var(--lp-error); }

  /* Battle */
  .battle-scores { display: flex; gap: 12px; justify-content: center; align-items: center; width: 100%; }
  .player-score { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 16px; border-radius: var(--lp-radius-sm); background: var(--lp-surface); border: 1.5px solid var(--lp-border); min-width: 80px; }
  .player-score.p1 { border-color: var(--lp-cat-blue, #4a9eff); }
  .player-score.p2 { border-color: var(--lp-warning, #e85d5d); }
  .player-score .p-label { font-size: .5rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--lp-muted); }
  .player-score .p-points { font-family: var(--lp-font-display); font-size: 1.4rem; font-weight: 600; }
  .player-score.p1 .p-points { color: var(--lp-cat-blue, #4a9eff); }
  .player-score.p2 .p-points { color: var(--lp-warning, #e85d5d); }
  .vs-badge { font-family: var(--lp-font-display); font-size: .8rem; font-style: italic; color: var(--lp-muted); }
  /* Squeeze + display-swap (NO rotateY/backface-visibility — ver AGENTS.md
     "Flashcard flip": el flip 3D real muestra la cara contraria espejada un
     frame en medio de la transición, confirmado en Safari y Chromium. Este
     card copiaba el rotateY viejo en vez del patrón ya usado en
     flashcard-shell.css. Bug reportado 2026-08-24: "arise" se veía al revés
     en Battle. */
  .battle-card { max-width: 360px; height: 180px; position: relative; }
  .battle-card .fc-inner { position: absolute; inset: 0; border-radius: var(--lp-radius-lg, 12px); transition: transform .15s var(--lp-ease); transform-origin: center; }
  .battle-card.squeeze .fc-inner { transform: scaleX(.02); }
  .battle-card.flipped .fc-face:not(.fc-back) { display: none; }
  .battle-card.flipped .fc-face.fc-back { display: flex; }
  .battle-card .fc-face { border-radius: var(--lp-radius-lg, 12px); }
  .battle-card .fc-term { font-size: 1.5rem; }
  .battle-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .battle-instruction {
    font-size: .58rem;
    font-weight: 600;
    color: color-mix(in srgb, var(--lp-muted) 80%, transparent);
    text-align: center;
    line-height: 1.2;
    margin: 0 0 4px;
    opacity: 1;
    transition: opacity 0.55s ease;
  }
  .battle-instruction.is-fading { opacity: 0; pointer-events: none; }
  .btn--sm { font-size: .7rem; padding: 8px 14px; }
  .btn--blue { background: var(--lp-cat-blue, #4a9eff); color: #fff; border: none; border-radius: var(--lp-radius-sm); cursor: pointer; }
  .btn--orange { background: var(--lp-warning, #e85d5d); color: #fff; border: none; border-radius: var(--lp-radius-sm); cursor: pointer; }
  .btn--red { background: var(--lp-error, #e85d5d); color: #fff; border: none; border-radius: var(--lp-radius-sm); cursor: pointer; }

  @media (max-width: 480px) {
    .write-inputs { flex-direction: column; align-items: center; }
    .write-field input { width: 180px; }
    .quiz-opts { grid-template-columns: 1fr; }
  }

  /* Match mode */
  .pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; max-width: 560px; }
  .pair-col-label { font-size: .62rem; font-weight: 800; text-transform: uppercase; color: var(--lp-muted); text-align: center; padding-bottom: 4px; }
  .pair-item {
    padding: 10px 12px; border-radius: var(--lp-radius-sm); border: 1.5px solid var(--lp-border);
    background: var(--lp-surface); color: var(--lp-ink); cursor: pointer; text-align: center;
    font-size: .82rem; font-weight: 600; transition: all .2s; user-select: none; line-height: 1.3;
  }
  .pair-item:hover:not(.matched):not(.wrong-flash) { border-color: var(--lp-cat-amber); background: rgba(245,158,11,.08); transform: translateY(-1px); }
  .pair-item.selected { border-color: var(--lp-cat-amber); background: rgba(245,158,11,.12); box-shadow: 0 0 0 2px rgba(245,158,11,.25); }
  .pair-item.matched { border-color: var(--lp-success); background: var(--lp-success-soft); color: var(--lp-success-dark); cursor: default; pointer-events: none; }
  .pair-item.wrong-flash { border-color: var(--lp-error); background: var(--lp-error-soft); }
  [data-theme="dark"] .pair-item.matched { color: #6FE8A8; }

  /* Sort mode */
  .sort-instruction { font-size: .72rem; font-weight: 700; color: var(--lp-muted); text-align: center; }
  .sort-score { font-family: var(--lp-font-mono); font-size: .7rem; color: var(--lp-muted); text-align: center; }
  .sort-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; max-width: 720px; padding: 12px; background: var(--lp-surface); border: 1.5px solid var(--lp-border); border-radius: var(--lp-radius-lg); min-height: 52px; }
  .sort-word {
    font-family: var(--lp-font-body); font-weight: 700; font-size: .82rem;
    padding: 8px 14px; border-radius: var(--lp-radius-sm); border: 1.5px solid var(--lp-border);
    background: var(--lp-surface); color: var(--lp-ink); cursor: pointer;
    transition: all .2s var(--lp-ease); user-select: none;
  }
  .sort-word:hover { border-color: var(--lp-cat-amber); transform: translateY(-2px); }
  .sort-word.selected { border-color: var(--lp-cat-amber); background: rgba(245,158,11,.12); box-shadow: 0 0 0 2px rgba(245,158,11,.25); }
  .sort-word.placed { opacity: .4; pointer-events: none; }
  .sort-word.correct { border-color: var(--lp-success); background: var(--lp-success-soft); color: var(--lp-success-dark); }
  .sort-word.wrong { border-color: var(--lp-error); background: var(--lp-error-soft); color: var(--lp-error-dark); }
  .sort-categories { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: 100%; max-width: 720px; }
  .sort-cat {
    background: var(--lp-surface); border: 1.5px solid var(--lp-border); border-radius: var(--lp-radius-lg);
    padding: 10px; min-height: 100px; display: flex; flex-direction: column; gap: 6px;
    transition: border-color .2s, background .2s; cursor: pointer;
  }
  .sort-cat:hover { border-color: var(--lp-cat-amber); }
  .sort-cat.drop-active { border-color: var(--lp-cat-amber); background: rgba(245,158,11,.06); }
  .sort-cat-label { font-family: var(--lp-font-display); font-size: .78rem; font-weight: 700; color: var(--lp-cat-amber); text-align: center; padding-bottom: 6px; border-bottom: 1px solid var(--lp-border); }
  .sort-cat-items { display: flex; flex-wrap: wrap; gap: 5px; min-height: 32px; }
  .sort-cat-items .sort-word { font-size: .72rem; padding: 5px 10px; }
  [data-theme="dark"] .sort-word.correct { color: #6FE8A8; }
  [data-theme="dark"] .sort-word.wrong { color: #FF9F9F; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="../index.html" class="lp-icon-btn" aria-label="Volver a HubFlow" title="Volver a HubFlow">←</a>
  </div>

  <div class="header">
    <h1>📝 Irregular Verbs</h1>

    <!-- Category filter -->
    <div class="cat-bar">
      <button class="cat-btn active" data-cat="all">All</button>
      <button class="cat-btn" data-cat="common">Common</button>
      <button class="cat-btn" data-cat="intermediate">Intermediate</button>
      <button class="cat-btn" data-cat="advanced">Advanced</button>
    </div>

    <!-- Modes -->
    <div class="pill-bar">
      <button class="pill-btn active" data-mode="study">📖 Study</button>
      <button class="pill-btn" data-mode="quiz">🎯 Quiz</button>
      <button class="pill-btn" data-mode="timed">⏱️ Timed</button>
      <button class="pill-btn" data-mode="write">✍️ Write</button>
      <button class="pill-btn" data-mode="match">🔗 Match</button>
      <button class="pill-btn" data-mode="sort">🗂️ Sort</button>
      <button class="pill-btn" data-mode="battle">⚔️ Battle</button>
    </div>

    <div class="timer-bar" id="timerBar"><span class="timer-display" id="timerDisplay">1:00</span></div>

    <div class="progress">
      <div class="progress__labels"><span id="progTxt">0 / 90</span><span id="progPct">0%</span></div>
      <div class="progress__track"><div class="progress__fill" id="progFill"></div></div>
    </div>
  </div>

  <div class="scroll-body">
    <!-- STUDY -->
    <div data-area="study">
      <div class="fc-count" id="fcCounter">1 / 90</div>
      <div class="fc-card" id="fcCard">
        <div class="fc-inner">
          <div class="fc-face verb-front">
            <div class="fc-emoji" id="fcEmoji">📝</div>
            <div class="fc-term" id="fcBase"></div>
            <div class="fc-ipa" id="fcIpa"></div>
            <div class="fc-hint">tap to see forms</div>
          </div>
          <div class="fc-face fc-back">
            <div class="verb-forms">
              <div class="vf-row vf-row--base"><span class="vf-label">Base</span><span class="vf-val-group"><span class="vf-val" id="fcBackBase"></span><span class="vf-ipa" id="fcBackIpa"></span></span></div>
              <div class="vf-row vf-row--past"><span class="vf-label">Past</span><span class="vf-val-group"><span class="vf-val" id="fcBackPast"></span><span class="vf-ipa" id="fcBackPastIpa"></span></span></div>
              <div class="vf-row vf-row--pp"><span class="vf-label">P. Part.</span><span class="vf-val-group"><span class="vf-val" id="fcBackPP"></span><span class="vf-ipa" id="fcBackPPIpa"></span></span></div>
            </div>
            <div class="vf-translation"><span class="vf-flag">🇪🇸</span><span class="vf-val" id="fcBackEs"></span></div>
          </div>
        </div>
      </div>
      <div class="fc-nav">
        <button class="lp-btn lp-btn--ghost" id="shuffleBtn">🔀</button>
        <button class="lp-btn lp-btn--ghost" id="prevBtn">←</button>
        <button class="lp-btn lp-btn--primary" id="nextBtn">→</button>
        <button class="lp-btn lp-btn--ghost" id="quizSkipBtn">⏭ Saltar</button>
        <button class="lp-btn lp-btn--purple" id="quizNextBtn" hidden>Siguiente →</button>
      </div>
    </div>

    <!-- QUIZ -->
    <div data-area="quiz">
      <div class="quiz-card">
        <div class="q-base" id="quizBase"></div>
        <div class="q-label" id="quizLabel">What is the past simple?</div>
      </div>
      <div class="quiz-opts" id="quizOptions"></div>
    </div>

    <!-- WRITE -->
    <div data-area="write">
      <div class="write-card">
        <div class="w-base" id="writeBase"></div>
        <div class="w-label" id="writeLabel">Write the past simple & past participle</div>
        <div class="write-inputs">
          <div class="write-field">
            <label>Past Simple</label>
            <input type="text" id="writePast" autocomplete="off" spellcheck="false">
          </div>
          <div class="write-field">
            <label>Past Participle</label>
            <input type="text" id="writePP" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="write-feedback" id="writeFeedback"></div>
      </div>
      <button class="lp-btn lp-btn--primary" id="checkBtn">Check ✓</button>
      <button class="lp-btn lp-btn--ghost" id="skipBtn" style="font-size:.72rem;">Skip →</button>
    </div>

    <!-- MATCH -->
    <div data-area="match">
      <div class="pair-grid" id="pairGrid"></div>
    </div>

    <!-- SORT -->
    <div data-area="sort">
      <div class="sort-instruction" id="sortInstruction">Tap a verb, then tap the category it belongs to</div>
      <div class="sort-score" id="sortScore">0 / 8</div>
      <div class="sort-pool" id="sortPool"></div>
      <div class="sort-categories" id="sortCategories"></div>
    </div>

    <!-- BATTLE -->
    <div data-area="battle">
      <div class="battle-instruction" id="battleInstruction">Press 1 or 2 to claim · S to skip</div>
      <div class="battle-scores">
        <div class="player-score p1"><span class="p-label">Player 1</span><span class="p-points" id="bp1">0</span></div>
        <span class="vs-badge">vs</span>
        <div class="player-score p2"><span class="p-label">Player 2</span><span class="p-points" id="bp2">0</span></div>
      </div>
      <div class="fc-card battle-card" id="battleCard">
        <div class="fc-inner">
          <div class="fc-face verb-front">
            <div class="fc-emoji">📝</div>
            <div class="fc-term" id="battleBase"></div>
            <div class="fc-hint">claim to answer</div>
          </div>
          <div class="fc-face fc-back">
            <div class="verb-forms">
              <div class="vf-row vf-row--base"><span class="vf-label">Base</span><span class="vf-val" id="bBackBase"></span></div>
              <div class="vf-row vf-row--past"><span class="vf-label">Past</span><span class="vf-val" id="bBackPast"></span></div>
              <div class="vf-row vf-row--pp"><span class="vf-label">P. Part.</span><span class="vf-val" id="bBackPP"></span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="battle-actions" id="battleClaim">
        <button class="lp-btn lp-btn--primary" id="bClaim1">1️⃣ P1</button>
        <button class="lp-btn lp-btn--ghost" id="bSkip">⏭️ Skip</button>
        <button class="lp-btn lp-btn--primary" id="bClaim2">2️⃣ P2</button>
      </div>
      <div class="battle-actions" id="battleJudge" style="display:none;">
        <button class="lp-btn lp-btn--primary" id="bCorrect">✓ Correct (Y)</button>
        <button class="lp-btn lp-btn--danger" id="bWrong">✗ Wrong (N)</button>
      </div>
      <div class="battle-actions" id="battleNext" style="display:none;">
        <button class="lp-btn lp-btn--primary" id="bNext">→ Next (Space)</button>
      </div>
    </div>
  </div>

  <div class="result-overlay" id="resultOverlay"></div>
</div>

<script type="module">
import { VERBS } from '../data/irregular-verbs.js';
import { initIrregularVerbs } from '../js/engines/irregular-verbs-engine.js';

initIrregularVerbs({
  verbs: VERBS,
  scoreKeyPrefix: 'irr',
});
</script>

<script type="module" src="../js/exercise-shell.js"></script>
</body>
</html>
