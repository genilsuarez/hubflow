<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrasal Verbs — HubFlow</title>
<meta name="description" content="Phrasal Verbs — Vocabulary &amp; Words nivel B1. Everyday, Work, Relationships, Travel, Get, Food, Turn, Advanced. Practica gratis en HubFlow.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23B8860B'/%3E%3Cpath d='M9 8h14v16H9z' stroke='white' stroke-width='2' fill='none'/%3E%3Cpath d='M12 12h8M12 16h6' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E" type="image/svg+xml">
<script src="../js/lp-theme.js"></script>
<script src="../js/lp-input-zoom.js"></script>
<script src="../js/lp-nav-icons.js"></script>
<script src="../js/lp-platform-urls.js"></script>
<script src="../js/lp-guest-reset.js"></script>
<script src="../js/lp-login.js"></script>

<script src="../js/lp-about.js"></script>
<style>body{background:#FFFFFF;color:#2C2418}[data-theme="dark"] body{background:#181B20;color:#E8EAED}</style>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/buttons.css">
<link rel="stylesheet" href="../css/exercise-enhanced.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/lp-nav-active.css">
<link rel="stylesheet" href="../css/lp-about.css">
<link rel="stylesheet" href="../css/standalone-shell.css">
<style>
  .progress__fill { background: var(--lp-cat-teal); }

  /* Category pills */
  [data-area] { gap: 12px; }

  /* Flashcard for study */
  .fc-card { max-width: 720px; height: 220px; }
  .pv-front .fc-term { font-size: 1.6rem; color: var(--lp-cat-teal); }
  .fc-ipa { font-family: 'JetBrains Mono', monospace; font-size: .78rem; color: var(--muted); letter-spacing: .02em; margin-top: 2px; min-height: 1.1em; }
  .pv-front .fc-detail { font-size: .72rem; margin-top: 2px; }
  .fc-back { background: rgba(61,127,127,.08); border-color: var(--lp-cat-teal); }
  .fc-back .pv-meaning { font-family: var(--lp-font-display); font-size: 1.2rem; font-weight: 600; color: var(--lp-ink); margin-bottom: 6px; }
  .fc-back .pv-example { font-size: .75rem; color: var(--lp-ink-soft); font-style: italic; }

  /* Quiz: match particle */
  .quiz-card { width: 100%; max-width: 720px; background: var(--lp-surface); border: 1.5px solid var(--lp-border); border-radius: var(--lp-radius-lg); padding: 20px; text-align: center; box-shadow: var(--lp-shadow-sm); }
  .quiz-card .q-verb { font-family: var(--lp-font-display); font-size: 1.5rem; font-weight: 600; color: var(--lp-cat-teal); }
  .quiz-card .q-blank { color: var(--lp-muted); }
  .quiz-card .q-meaning { font-size: .72rem; color: var(--lp-muted); font-weight: 600; margin-top: 4px; }
  .quiz-opts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 720px; }
  .quiz-opt {
    font-family: var(--lp-font-body); font-weight: 700; font-size: .85rem;
    padding: 11px 18px; border-radius: var(--lp-radius-sm); border: 1.5px solid var(--lp-border);
    background: var(--lp-surface); color: var(--lp-ink); cursor: pointer;
    transition: all .2s var(--lp-ease); min-width: 65px; text-align: center;
  }
  .quiz-opt:hover:not(.disabled) { border-color: var(--lp-cat-teal); background: rgba(61,127,127,.08); transform: translateY(-2px); }
  .quiz-opt.correct { border-color: var(--lp-success); background: var(--lp-success-soft); color: var(--lp-success-dark); }
  .quiz-opt.wrong { border-color: var(--lp-error); background: var(--lp-error-soft); color: var(--lp-error-dark); }
  .quiz-opt.disabled { cursor: default; opacity: .7; }
  [data-theme="dark"] .quiz-opt.correct { color: #6FE8A8; }
  [data-theme="dark"] .quiz-opt.wrong { color: #FF9F9F; }

  /* Write mode */
  .write-card { width: 100%; max-width: 720px; background: var(--lp-surface); border: 1.5px solid var(--lp-border); border-radius: var(--lp-radius-lg); padding: 24px 20px; text-align: center; box-shadow: var(--lp-shadow-sm); }
  .write-card .w-meaning { font-family: var(--lp-font-display); font-size: 1.1rem; font-weight: 600; color: var(--lp-cat-teal); margin-bottom: 14px; }
  /* Inline "fill in the blank" sentence: the input sits inside the sentence
     flow instead of a disconnected row below it, so what you're completing
     and where it goes are the same thing (natural-language-form pattern). */
  .w-sentence { font-size: 1.05rem; font-weight: 500; color: var(--lp-ink); line-height: 2.4; }
  .w-sentence .w-input {
    font-family: var(--lp-font-mono); font-size: .95rem; font-weight: 700;
    min-width: 44px; text-align: center; vertical-align: baseline;
    border: none; border-bottom: 2.5px solid var(--lp-border);
    border-radius: 3px 3px 0 0; background: color-mix(in srgb, var(--lp-cat-teal) 6%, transparent);
    color: var(--lp-cat-teal); padding: 1px 4px; margin: 0 2px; outline: none;
    transition: border-color .2s, background-color .2s;
  }
  .w-sentence .w-input:focus { border-color: var(--lp-cat-teal); background: color-mix(in srgb, var(--lp-cat-teal) 14%, transparent); }
  .w-sentence .w-input.correct { border-color: var(--lp-success); background: var(--lp-success-soft); color: var(--lp-success-dark); }
  .w-sentence .w-input.wrong { border-color: var(--lp-error); background: var(--lp-error-soft); color: var(--lp-error-dark); }
  .w-sentence .w-input:disabled { opacity: 1; }
  .write-feedback { font-size: .72rem; font-weight: 600; margin-top: 14px; min-height: 1.2em; }
  .write-feedback.ok { color: var(--lp-success); }
  .write-feedback.err { color: var(--lp-error); }


  /* Battle */
  .battle-scores { display: flex; gap: 12px; justify-content: center; align-items: center; width: 100%; }
  .player-score { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 16px; border-radius: var(--lp-radius-sm); background: var(--lp-surface); border: 1.5px solid var(--lp-border); min-width: 80px; }
  .player-score.p1 { border-color: var(--lp-cat-blue, #4a9eff); }
  .player-score.p2 { border-color: var(--lp-warning, #e85d5d); }
  .player-score .p-label { font-size: .5rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--lp-muted); }
  .player-score .p-points { font-family: var(--lp-font-display); font-size: 1.4rem; font-weight: 600; }
  .player-score.p1 .p-points { color: var(--lp-cat-blue, #4a9eff); }
  .player-score.p2 .p-points { color: var(--lp-warning, #e85d5d); }
  .vs-badge { font-family: var(--lp-font-display); font-size: .8rem; font-style: italic; color: var(--lp-muted); }
  .battle-card { max-width: 360px; height: 160px; perspective: 1200px; position: relative; }
  .battle-card .fc-inner { position: absolute; inset: 0; border-radius: var(--lp-radius-lg, 12px); transition: transform .55s ease; transform-style: preserve-3d; }
  .battle-card.flipped .fc-inner { transform: rotateY(180deg); }
  .battle-card .fc-face { border-radius: var(--lp-radius-lg, 12px); }
  .battle-card .fc-term { font-size: 1.3rem; }
  .battle-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .battle-instruction {
    font-size: .58rem;
    font-weight: 600;
    color: color-mix(in srgb, var(--lp-muted) 80%, transparent);
    text-align: center;
    line-height: 1.2;
    margin: 0 0 4px;
    opacity: 1;
    transition: opacity 0.55s ease;
  }
  .battle-instruction.is-fading { opacity: 0; pointer-events: none; }
  .btn--sm { font-size: .7rem; padding: 8px 14px; }
  .btn--blue { background: var(--lp-cat-blue, #4a9eff); color: #fff; border: none; border-radius: var(--lp-radius-sm); cursor: pointer; }
  .btn--orange { background: var(--lp-warning, #e85d5d); color: #fff; border: none; border-radius: var(--lp-radius-sm); cursor: pointer; }
  .btn--red { background: var(--lp-error, #e85d5d); color: #fff; border: none; border-radius: var(--lp-radius-sm); cursor: pointer; }

  /* Sort mode */
  .sort-instruction { font-size: .72rem; font-weight: 700; color: var(--lp-muted); text-align: center; }
  .sort-score { font-family: var(--lp-font-mono); font-size: .7rem; color: var(--lp-muted); text-align: center; }
  .sort-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; max-width: 720px; padding: 12px; background: var(--lp-surface); border: 1.5px solid var(--lp-border); border-radius: var(--lp-radius-lg); min-height: 52px; }
  .sort-word {
    font-family: var(--lp-font-body); font-weight: 700; font-size: .82rem;
    padding: 8px 14px; border-radius: var(--lp-radius-sm); border: 1.5px solid var(--lp-border);
    background: var(--lp-surface); color: var(--lp-ink); cursor: pointer;
    transition: all .2s var(--lp-ease); user-select: none;
  }
  .sort-word:hover { border-color: var(--lp-cat-teal); transform: translateY(-2px); }
  .sort-word.selected { border-color: var(--lp-cat-teal); background: rgba(61,127,127,.12); box-shadow: 0 0 0 2px rgba(61,127,127,.25); }
  .sort-word.placed { opacity: .4; pointer-events: none; }
  .sort-word.correct { border-color: var(--lp-success); background: var(--lp-success-soft); color: var(--lp-success-dark); }
  .sort-word.wrong { border-color: var(--lp-error); background: var(--lp-error-soft); color: var(--lp-error-dark); }
  .sort-categories { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: 100%; max-width: 720px; }
  .sort-cat {
    background: var(--lp-surface); border: 1.5px solid var(--lp-border); border-radius: var(--lp-radius-lg);
    padding: 10px; min-height: 100px; display: flex; flex-direction: column; gap: 6px;
    transition: border-color .2s, background .2s; cursor: pointer;
  }
  .sort-cat:hover { border-color: var(--lp-cat-teal); }
  .sort-cat.drop-active { border-color: var(--lp-cat-teal); background: rgba(61,127,127,.06); }
  .sort-cat-label { font-family: var(--lp-font-display); font-size: .78rem; font-weight: 700; color: var(--lp-cat-teal); text-align: center; padding-bottom: 6px; border-bottom: 1px solid var(--lp-border); }
  .sort-cat-items { display: flex; flex-wrap: wrap; gap: 5px; min-height: 32px; }
  .sort-cat-items .sort-word { font-size: .72rem; padding: 5px 10px; }
  [data-theme="dark"] .sort-word.correct { color: #6FE8A8; }
  [data-theme="dark"] .sort-word.wrong { color: #FF9F9F; }

  @media (max-width: 480px) {
    .quiz-opt { min-width: 55px; padding: 9px 14px; }
  }

  /* Match mode */
  .pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; max-width: 560px; }
  .pair-col-label { font-size: .62rem; font-weight: 800; text-transform: uppercase; color: var(--lp-muted); text-align: center; padding-bottom: 4px; }
  .pair-item {
    padding: 10px 12px; border-radius: var(--lp-radius-sm); border: 1.5px solid var(--lp-border);
    background: var(--lp-surface); color: var(--lp-ink); cursor: pointer; text-align: center;
    font-size: .82rem; font-weight: 600; transition: all .2s; user-select: none; line-height: 1.3;
  }
  .pair-item:hover:not(.matched):not(.wrong-flash) { border-color: var(--lp-cat-teal); background: rgba(61,127,127,.08); transform: translateY(-1px); }
  .pair-item.selected { border-color: var(--lp-cat-teal); background: rgba(61,127,127,.12); box-shadow: 0 0 0 2px rgba(61,127,127,.25); }
  .pair-item.matched { border-color: var(--lp-success); background: var(--lp-success-soft); color: var(--lp-success-dark); cursor: default; pointer-events: none; }
  .pair-item.wrong-flash { border-color: var(--lp-error); background: var(--lp-error-soft); }
  [data-theme="dark"] .pair-item.matched { color: #6FE8A8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="../index.html" class="lp-icon-btn" aria-label="Volver a HubFlow" title="Volver a HubFlow">←</a>
  </div>

  <div class="header">
    <h1>🚀 Phrasal Verbs</h1>

    <!-- Category -->
    <div class="cat-bar" id="catBar"></div>

    <!-- Modes -->
    <div class="pill-bar">
      <button class="pill-btn active" data-mode="study">📖 Study</button>
      <button class="pill-btn" data-mode="quiz">🎯 Quiz</button>
      <button class="pill-btn" data-mode="timed">⏱️ Timed</button>
      <button class="pill-btn" data-mode="write">✍️ Write</button>
      <button class="pill-btn" data-mode="match">🔗 Match</button>
      <button class="pill-btn" data-mode="sort">🗂️ Sort</button>
      <button class="pill-btn" data-mode="battle">⚔️ Battle</button>
    </div>

    <div class="timer-bar" id="timerBar"><span class="timer-display" id="timerDisplay">1:00</span></div>

    <div class="progress">
      <div class="progress__labels"><span id="progTxt">0 / 18</span><span id="progPct">0%</span></div>
      <div class="progress__track"><div class="progress__fill" id="progFill"></div></div>
    </div>
  </div>

  <div class="scroll-body">
    <!-- STUDY -->
    <div data-area="study">
      <div class="fc-count" id="fcCounter">1 / 18</div>
      <div class="fc-card" id="fcCard">
        <div class="fc-inner">
          <div class="fc-face pv-front">
            <div class="fc-emoji" id="fcEmoji">🚀</div>
            <div class="fc-term" id="fcVerb"></div>
            <div class="fc-ipa" id="fcIpa"></div>
            <div class="fc-detail" id="fcEs"></div>
            <div class="fc-hint">tap to see example</div>
          </div>
          <div class="fc-face fc-back">
            <div class="pv-meaning" id="fcMeaning"></div>
            <div class="pv-example" id="fcExample"></div>
          </div>
        </div>
      </div>
      <div class="fc-nav">
        <button class="lp-btn lp-btn--ghost" id="shuffleBtn">🔀</button>
        <button class="lp-btn lp-btn--ghost" id="prevBtn">←</button>
        <button class="lp-btn lp-btn--primary" id="nextBtn">→</button>
        <button class="listen-btn" id="speakBtn" aria-pressed="false" aria-label="Pronunciación automática: OFF" style="width:44px;height:44px;border-radius:50%;border:2px solid var(--lp-cat-teal);background:rgba(61,127,127,.08);font-size:1.1rem;cursor:pointer;transition:all .2s;display:none;align-items:center;justify-content:center;flex-shrink:0;">🔇</button>
        <button class="lp-btn lp-btn--ghost" id="quizSkipBtn">⏭ Saltar</button>
        <button class="lp-btn lp-btn--purple" id="quizNextBtn" hidden>Siguiente →</button>
      </div>
    </div>

    <!-- QUIZ -->
    <div data-area="quiz">
      <div class="quiz-card">
        <div class="q-verb" id="quizVerb">look <span class="q-blank">___</span></div>
        <div class="q-meaning" id="quizMeaning"></div>
      </div>
      <div class="quiz-opts" id="quizOptions"></div>
    </div>

    <!-- WRITE -->
    <div data-area="write">
      <div class="write-card">
        <div class="w-meaning" id="writeMeaning"></div>
        <div class="w-sentence" id="writeSentence"></div>
        <div class="write-feedback" id="writeFeedback"></div>
      </div>
      <button class="lp-btn lp-btn--primary" id="checkBtn">Comprobar ✓</button>
      <button class="lp-btn lp-btn--ghost" id="skipBtn" style="font-size:.72rem;">Saltar →</button>
    </div>

    <!-- MATCH -->
    <div data-area="match">
      <div class="pair-grid" id="pairGrid"></div>
    </div>

    <!-- SORT -->
    <div data-area="sort">
      <div class="sort-instruction" id="sortInstruction">Tap a verb, then tap the category it belongs to</div>
      <div class="sort-score" id="sortScore">0 / 8</div>
      <div class="sort-pool" id="sortPool"></div>
      <div class="sort-categories" id="sortCategories"></div>
    </div>

    <!-- BATTLE -->
    <div data-area="battle">
      <div class="battle-instruction" id="battleInstruction">Press 1 or 2 to claim · S to skip</div>
      <div class="battle-scores">
        <div class="player-score p1"><span class="p-label">Player 1</span><span class="p-points" id="bp1">0</span></div>
        <span class="vs-badge">vs</span>
        <div class="player-score p2"><span class="p-label">Player 2</span><span class="p-points" id="bp2">0</span></div>
      </div>
      <div class="fc-card battle-card" id="battleCard">
        <div class="fc-inner">
          <div class="fc-face pv-front">
            <div class="fc-emoji" id="battleEmoji">🚀</div>
            <div class="fc-term" id="battleTerm"></div>
            <div class="fc-hint">claim to answer</div>
          </div>
          <div class="fc-face fc-back">
            <div class="pv-meaning" id="battleMeaning"></div>
            <div class="pv-example" id="battleExample" style="font-size:.7rem;"></div>
          </div>
        </div>
      </div>
      <div class="battle-actions" id="battleClaim">
        <button class="lp-btn lp-btn--primary" id="bClaim1">1️⃣ P1</button>
        <button class="lp-btn lp-btn--ghost" id="bSkip">⏭️ Skip</button>
        <button class="lp-btn lp-btn--primary" id="bClaim2">2️⃣ P2</button>
      </div>
      <div class="battle-actions" id="battleJudge" style="display:none;">
        <button class="lp-btn lp-btn--primary" id="bCorrect">✓ Correct (Y)</button>
        <button class="lp-btn lp-btn--danger" id="bWrong">✗ Wrong (N)</button>
      </div>
      <div class="battle-actions" id="battleNext" style="display:none;">
        <button class="lp-btn lp-btn--primary" id="bNext">→ Next (Space)</button>
      </div>
    </div>
  </div>

  <div class="result-overlay" id="resultOverlay"></div>
</div>

<script type="module">
import { CATEGORIES } from '../data/phrasal-verbs.js';
import { initPhrasalVerbs } from '../js/engines/phrasal-verbs-engine.js';

initPhrasalVerbs({
  categories: CATEGORIES,
  scoreKeyPrefix: 'phrasal',
});
</script>

<script type="module" src="../js/exercise-shell.js"></script>
</body>
</html>
