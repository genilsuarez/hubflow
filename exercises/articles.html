<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articles — HubFlow</title>
<meta name="description" content="Articles (a/an/the/∅) — Grammar &amp; Spelling nivel A1. Basics, Geographic names, Fixed expressions, In context, Never use &quot;the&quot;. Practica gratis en HubFlow.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23B8860B'/%3E%3Cpath d='M9 8h14v16H9z' stroke='white' stroke-width='2' fill='none'/%3E%3Cpath d='M12 12h8M12 16h6' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E" type="image/svg+xml">
<script src="../js/lp-theme.min.js"></script>
<script src="../js/lp-input-zoom.min.js"></script>
<script src="../js/lp-nav-icons.min.js"></script>
<script src="../js/lp-platform-urls.min.js"></script>
<script src="../js/lp-guest-reset.min.js"></script>
<script src="../js/lp-login.min.js"></script>
<script src="../js/lp-nav-helpers.min.js"></script>
<script src="../js/lp-about-content.min.js"></script>
<script src="../js/lp-about.min.js"></script>
<style>body{background:#FFFFFF;color:#2C2418}[data-theme="dark"] body{background:#181B20;color:#E8EAED}</style>
<link rel="stylesheet" href="../css/base.min.css">
<link rel="stylesheet" href="../css/components.min.css">
<link rel="stylesheet" href="../css/buttons.min.css">
<link rel="stylesheet" href="../css/exercise-enhanced.min.css">
<link rel="stylesheet" href="../css/sidebar.min.css">
<link rel="stylesheet" href="../css/lp-nav-active.min.css">
<link rel="stylesheet" href="../css/lp-about.min.css">
<link rel="stylesheet" href="../css/sentence-quiz.min.css">
</head>
<body>
<div class="wrap" data-color="azure">
  <div class="top-bar">
    <a href="../index.html" class="lp-icon-btn" aria-label="Volver a HubFlow" title="Volver a HubFlow">←</a>
  </div>

  <div class="header">
    <h1>📝 Articles (a/an/the/∅)</h1>

    <!-- Category -->
    <div class="cat-bar" id="catBar"></div>

    <!-- Modes -->
    <div class="pill-bar">
      <button class="pill-btn active" data-mode="study">📖 Study</button>
      <button class="pill-btn" data-mode="quiz">🎯 Quiz</button>
      <button class="pill-btn" data-mode="timed">⏱️ Timed</button>
    </div>

    <div class="timer-bar" id="timerBar"><span class="timer-display" id="timerDisplay">1:00</span></div>

    <div class="progress">
      <div class="progress__labels"><span id="progTxt">0 / 20</span><span id="progPct">0%</span></div>
      <div class="progress__track"><div class="progress__fill" id="progFill"></div></div>
    </div>
  </div>

  <div class="scroll-body">
    <!-- QUIZ / TIMED -->
    <div data-area="quiz">
      <div class="sentence-card">
        <div class="sc-icon" id="scIcon"></div>
        <div class="sc-text" id="scText"></div>
        <div class="sc-counter" id="scCounter"></div>
      </div>
      <div class="word-options" id="wordOptions"></div>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <!-- STUDY -->
    <div data-area="study">
      <div class="fc-count" id="fcCounter">1 / 20</div>
      <div class="fc-card" id="fcCard">
        <div class="fc-inner">
          <div class="fc-face art-front">
            <div class="fc-emoji" id="fcEmoji">📝</div>
            <div class="fc-term" id="fcSentence"></div>
            <div class="fc-hint">tap to see answer</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-term" id="fcAnswer" style="font-size:1.4rem;color:var(--lp-success)"></div>
            <div class="fc-detail" id="fcExplain"></div>
          </div>
        </div>
      </div>
      <div class="fc-nav">
        <button class="lp-btn lp-btn--ghost" id="shuffleBtn">🔀</button>
        <button class="lp-btn lp-btn--ghost" id="prevBtn">←</button>
        <button class="lp-btn lp-btn--primary" id="nextBtn">→</button>
        <button class="lp-btn lp-btn--ghost" id="quizSkipBtn">⏭ Saltar</button>
        <button class="lp-btn lp-btn--purple" id="quizNextBtn" hidden>Siguiente →</button>
      </div>
    </div>
  </div>

  <div class="result-overlay" id="resultOverlay"></div>
</div>

<script type="module">
import { CATEGORIES } from '../data/articles.js';
import { initSentenceQuiz } from '../js/engines/sentence-quiz-engine.js';

initSentenceQuiz({
  categories: CATEGORIES,
  scoreKeyPrefix: 'art',
  timedQuestionCount: 12,
});
</script>

<script type="module" src="../js/exercise-shell.js"></script>
</body>
</html>
